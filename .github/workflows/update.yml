name: Auto Update Playlist and JSON

on:
  schedule:
    # প্রতি ৬ ঘণ্টা পর পর রান হবে (UTC সময় অনুযায়ী)
    - cron: '0 */6 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  update-files:
    runs-on: ubuntu-latest

    permissions:
      contents: write # ফাইলে পুশ করার পারমিশন

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Fetch Script
        run: |
          python fetch_channels.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ফাইল তৈরি হয়েছে কিনা চেক করে add করবে
          if [ -f "channels.json" ] || [ -f "playlist.m3u" ]; then
            git add channels.json playlist.m3u
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist and JSON [skip ci]" && git push)
          else
            echo "কোনো ফাইল তৈরি হয়নি!"
            exit 1
          fi
